<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Cyan to Electric Blue Gradient -->
    <linearGradient id="autobusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F2FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4FACFE;stop-opacity:1" />
    </linearGradient>
    <!-- userSpaceOnUse: the cross-bar is a horizontal line, so its object bounding
         box is zero-height and an objectBoundingBox gradient would not render at all. -->
    <linearGradient id="nodeGrad" gradientUnits="userSpaceOnUse" x1="47" y1="100" x2="113" y2="100">
      <stop offset="0%" style="stop-color:#0072FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F2FE;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Thicker-line "A" variant of the AUTOBUS icon: open-bottom legs + cross-bar, same palette and nodes -->
  <g>
    <!-- Two legs meeting at the apex (open base, like the letter A) -->
    <path d="M 30 140 L 80 20 L 130 140"
          fill="none" stroke="url(#autobusGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cross-bar of the A -->
    <path d="M 47 100 L 113 100" stroke="url(#nodeGrad)" stroke-width="9" stroke-linecap="round"/>

    <!-- Autonomous System Network Nodes -->
    <circle cx="80" cy="20" r="9" fill="#00F2FE"/>
    <circle cx="47" cy="100" r="7" fill="#4FACFE"/>
    <circle cx="113" cy="100" r="7" fill="#0072FF"/>
    <circle cx="30" cy="140" r="8" fill="#00F2FE"/>
    <circle cx="130" cy="140" r="8" fill="#0072FF"/>
  </g>
</svg>
